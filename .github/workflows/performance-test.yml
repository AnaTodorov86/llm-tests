name: LLM Performance Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Load profile'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - chat
          - code
          - stress
      provider:
        description: 'LLM provider'
        required: true
        default: 'groq'
        type: choice
        options:
          - groq
          - openai
  schedule:
    - cron: '0 2 * * *'

jobs:
  performance-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install k6
        run: |
          wget -q https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz
          tar -xzf k6-v0.49.0-linux-amd64.tar.gz
          sudo cp k6-v0.49.0-linux-amd64/k6 /usr/local/bin/
      
      - name: Run Test
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOAD_PROFILE: ${{ github.event.inputs.profile || 'baseline' }}
          PROVIDER: ${{ github.event.inputs.provider || 'groq' }}
        run: |
          k6 cloud \
            -e LOAD_PROFILE="${LOAD_PROFILE}" \
            -e PROVIDER="${PROVIDER}" \
            -e GROQ_API_KEY="${GROQ_API_KEY}" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            tests/performance_test.js
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-${{ github.run_number }}
          path: summary.json
          retention-days: 90